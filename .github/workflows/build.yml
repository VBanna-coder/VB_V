name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: ArtemSB/buildozer-action@v1
      with:
        command: android debug
        buildozer_version: master
    - uses: actions/upload-artifact@v3
      with:
        name: apk
        path: bin/*.apk
